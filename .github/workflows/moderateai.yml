name: ModerateAI
on:
  push:
    paths: ["18-moderate-ai/**", ".github/workflows/moderateai.yml"]
  pull_request:
    paths: ["18-moderate-ai/**", ".github/workflows/moderateai.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 18-moderate-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 18-moderate-ai/src/moderateai-web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: dotnet restore ModerateAI.slnx --locked-mode
      - run: dotnet tool restore
      - run: dotnet csharpier check src tests
      - run: dotnet build ModerateAI.slnx -c Release --no-restore
      - run: dotnet test ModerateAI.slnx -c Release --no-build --filter 'Category!=Integration' --logger 'trx;LogFileName=unit.trx' --results-directory output/unit
      - run: npm ci && npm run build && npm test && npm run format:check
        working-directory: 18-moderate-ai/src/moderateai-web
      - run: python3 scripts/cloud-build.py
      - run: python3 scripts/create-env.py && python3 scripts/prepare-s3.py
      - name: Start test containers
        run: |
          if ! docker compose -f compose.yaml -f compose.test.yaml up -d --no-build --wait --wait-timeout 120; then
            {
              echo '## Container startup diagnostics'
              echo '### Service state'
              docker compose -f compose.yaml -f compose.test.yaml ps --all || true
              echo '### Recent container logs'
              docker compose -f compose.yaml -f compose.test.yaml logs --no-color --tail=40 || true
            } > /tmp/moderateai-compose-diagnostics.md
            cat /tmp/moderateai-compose-diagnostics.md
            cat /tmp/moderateai-compose-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
            docker compose -f compose.yaml -f compose.test.yaml ps --all --format json > /tmp/moderateai-compose-state.jsonl || true
            docker compose -f compose.yaml -f compose.test.yaml logs --no-color --tail=80 > /tmp/moderateai-compose-logs.txt 2>&1 || true
            python3 - <<'PY'
            import json
            import re
            from pathlib import Path

            state = Path('/tmp/moderateai-compose-state.jsonl').read_text().splitlines()
            for line in state:
                try:
                    item = json.loads(line)
                    message = ' '.join(str(item.get(key, '')) for key in ('Service', 'State', 'Health', 'ExitCode')).strip()
                    print(f'::error title=Compose service state::{message}')
                except json.JSONDecodeError:
                    continue

            logs = Path('/tmp/moderateai-compose-logs.txt').read_text(errors='replace').splitlines()
            relevant = [line for line in logs if re.search(r'error|failed|forbidden|denied|refused|unhealthy|fatal|exception|unavailable', line, re.I)]
            for line in relevant[-12:]:
                message = line[-700:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A').replace(':', '%3A').replace(',', '%2C')
                print(f'::error title=Compose startup log::{message}')
            PY
            exit 1
          fi
      - run: python3 scripts/readiness.py && python3 scripts/test-integration.py && python3 scripts/smoke.py
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: 18-moderate-ai/src/moderateai-web
      - if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moderateai-results
          path: 18-moderate-ai/output/
