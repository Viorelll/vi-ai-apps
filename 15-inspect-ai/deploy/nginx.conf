server {
 listen 8080; server_name _; root /usr/share/nginx/html; index index.html;
 client_max_body_size 55m;
 resolver 127.0.0.11 valid=10s;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location /api/ { set $backend http://api:8080; proxy_pass $backend$request_uri; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 75s; }
 location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
 location / { try_files $uri $uri/ /index.html; }
}
