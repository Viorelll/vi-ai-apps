name: tutorai
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorai}
      POSTGRES_USER: ${POSTGRES_USER:-tutorai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-db-password}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  minio:
    environment:
      NO_PROXY: localhost,127.0.0.1,db,minio,api,ai
      no_proxy: localhost,127.0.0.1,db,minio,api,ai
    image: chrislusf/seaweedfs:4.06@sha256:a064c6923daf4451c943cec2f437a67523d7792ee589089bc4d4c27a61d78dea
    command: ["mini", "-dir=/data", "-ip=minio", "-ip.bind=0.0.0.0", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json", "-admin.ui=false", "-webdav=false", "-master.telemetry=false"]
    volumes: ["minio-data:/data", "./.dev/s3.json:/etc/seaweedfs/s3.json:ro"]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  ai:
    build: {context: ., dockerfile: deploy/Ai.Dockerfile}
    environment: &ai-env
      NO_PROXY: localhost,127.0.0.1,db,minio,api,ai
      no_proxy: localhost,127.0.0.1,db,minio,api,ai
      ASPNETCORE_URLS: http://+:8080
      Internal__Key: ${INTERNAL_API_KEY:-replace-with-internal-key}
      Ai__DemoMode: ${AI_DEMO_MODE:-false}
      Foundry__OpenAiEndpoint: ${FOUNDRY_OPENAI_ENDPOINT:-https://your-resource.openai.azure.com/openai/v1/}
      Foundry__ApiKey: ${FOUNDRY_API_KEY:-replace-with-foundry-key}
      Foundry__ChatDeployment: ${CHAT_DEPLOYMENT:-replace-with-chat-deployment}
      Foundry__JudgeDeployment: ${JUDGE_DEPLOYMENT:-replace-with-separate-judge-deployment}
      ContentUnderstanding__Endpoint: ${CU_ENDPOINT:-https://your-resource.cognitiveservices.azure.com/}
      ContentUnderstanding__ApiKey: ${CU_API_KEY:-replace-with-cu-key}
      ContentUnderstanding__Analyzer: ${CU_ANALYZER:-prebuilt-documentSearch}
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: ${S3_BUCKET:-tutorai}
      Storage__AccessKey: ${S3_ROOT_USER:-tutorai-local}
      Storage__SecretKey: ${S3_ROOT_PASSWORD:-replace-with-local-storage-password}
    restart: unless-stopped
  migrate:
    build: {context: ., dockerfile: deploy/Api.Dockerfile}
    command: ["--migrate"]
    environment: &api-env
      NO_PROXY: localhost,127.0.0.1,db,minio,api,ai
      no_proxy: localhost,127.0.0.1,db,minio,api,ai
      ASPNETCORE_URLS: http://+:8080
      Internal__Key: ${INTERNAL_API_KEY:-replace-with-internal-key}
      Ai__BaseUrl: http://ai:8080/
      Ai__DemoMode: ${AI_DEMO_MODE:-false}
      ConnectionStrings__App: Host=db;Database=${POSTGRES_DB:-tutorai};Username=${POSTGRES_USER:-tutorai};Password=${POSTGRES_PASSWORD:-replace-with-local-db-password}
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: ${S3_BUCKET:-tutorai}
      Storage__AccessKey: ${S3_ROOT_USER:-tutorai-local}
      Storage__SecretKey: ${S3_ROOT_PASSWORD:-replace-with-local-storage-password}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    build: {context: ., dockerfile: deploy/Api.Dockerfile}
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      ai: {condition: service_started}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: deploy/Web.Dockerfile}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
  minio-data:
