services:
  api:
    build: {dockerfile: deploy/Api.Cloud.Dockerfile, secrets: [egress_ca]}
  ai:
    build: {dockerfile: deploy/Ai.Cloud.Dockerfile, secrets: [egress_ca]}
  migrate:
