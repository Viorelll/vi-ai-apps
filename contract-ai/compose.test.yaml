services:
  db:
    environment:
      POSTGRES_DB: contractai_tests
      POSTGRES_PASSWORD: contractai-test-password
    ports: ["127.0.0.1:54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractai -d contractai_tests"]
  minio:
    environment:
      MINIO_ROOT_USER: contractai-test
      MINIO_ROOT_PASSWORD: contractai-test-password
    ports: ["127.0.0.1:59000:9000"]
