name: videostudioai
services:
 db:
  image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
  environment:
   POSTGRES_USER: videostudio
   POSTGRES_PASSWORD: ${DB_PASSWORD:-dummy-db-password}
   POSTGRES_DB: videostudio
  volumes: [pgdata:/var/lib/postgresql/data]
  healthcheck:
   test: [CMD-SHELL, "pg_isready -U videostudio -d videostudio"]
   interval: 5s
   timeout: 3s
   retries: 20
  restart: unless-stopped
 minio:
  build: {context: ., dockerfile: deploy/Minio.Dockerfile}
  environment:
   MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dummy-minio}
   MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dummy-minio-password}
  volumes: [objectdata:/data]
  restart: unless-stopped
 ai:
  build: {context: ., dockerfile: deploy/Ai.Dockerfile}
  environment:
   InternalKey: ${INTERNAL_API_KEY:-dummy-internal-key-replace-me}
   Foundry__Mode: ${AI_MODE:-Demo}
   Foundry__OpenAiEndpoint: ${FOUNDRY_OPENAI_ENDPOINT:-https://RESOURCE.openai.azure.com/openai/v1/}
   Foundry__ApiKey: ${FOUNDRY_API_KEY:-dummy-foundry-api-key}
   Foundry__ChatDeployment: ${CHAT_DEPLOYMENT:-dummy-gpt-4.1-mini}
   Foundry__Seconds__0: ${VIDEO_SECONDS_0:-4}
   Foundry__Seconds__1: ${VIDEO_SECONDS_1:-8}
   Foundry__Seconds__2: ${VIDEO_SECONDS_2:-12}
   Foundry__Sizes__0: ${VIDEO_SIZE_0:-1280x720}
   Foundry__Sizes__1: ${VIDEO_SIZE_1:-720x1280}
   Foundry__VideoDeployment: ${VIDEO_DEPLOYMENT:-dummy-sora-2}
  restart: unless-stopped
 migrate:
  build: {context: ., dockerfile: deploy/Api.Dockerfile}
  command: [--migrate]
  environment:
   ConnectionStrings__App: Host=db;Database=videostudio;Username=videostudio;Password=${DB_PASSWORD:-dummy-db-password}
  depends_on:
   db: {condition: service_healthy}
  restart: "no"
 api:
  build: {context: ., dockerfile: deploy/Api.Dockerfile}
  environment:
   ConnectionStrings__App: Host=db;Database=videostudio;Username=videostudio;Password=${DB_PASSWORD:-dummy-db-password}
   Ai__Endpoint: http://ai:8080/
   Ai__InternalKey: ${INTERNAL_API_KEY:-dummy-internal-key-replace-me}
   Storage__Endpoint: http://minio:9000
   Storage__AccessKey: ${MINIO_ROOT_USER:-dummy-minio}
   Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-dummy-minio-password}
   Storage__Bucket: videostudio
  depends_on:
   db: {condition: service_healthy}
   minio: {condition: service_healthy}
   ai: {condition: service_healthy}
   migrate: {condition: service_completed_successfully}
  restart: unless-stopped
 web:
  build: {context: ., dockerfile: deploy/Web.Dockerfile}
  ports: ["127.0.0.1:8080:80"]
  depends_on:
   api: {condition: service_healthy}
  restart: unless-stopped
volumes:
 pgdata:
 objectdata:
