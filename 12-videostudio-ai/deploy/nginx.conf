server {
 listen 80;
 server_tokens off;
 client_max_body_size 50m;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
 location /api/ {proxy_pass http://api:8080;proxy_read_timeout 120s;proxy_request_buffering off;}
 location /health/ {proxy_pass http://api:8080;}
 location / {try_files $uri $uri/ /index.html;}
}
