name: contractai
x-api-env: &api-env
  no_proxy: "minio,api,ai,db,localhost,127.0.0.1"
  NO_PROXY: "minio,api,ai,db,localhost,127.0.0.1"
  ASPNETCORE_HTTP_PORTS: "8080"
  ConnectionStrings__App: Host=db;Database=contractai;Username=contractai;Password=${DB_PASSWORD:?set DB_PASSWORD}
  Storage__Endpoint: http://minio:9000
  Storage__AccessKey: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  Storage__Bucket: contractai
  Ai__BaseUrl: http://ai:8080/
  Internal__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_DB: contractai
      POSTGRES_USER: contractai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractai -d contractai"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  minio:
    image: contractai-minio:local
    build: { context: ., dockerfile: deploy/Minio.Dockerfile }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["objectdata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  ai:
    image: contractai-ai:local
    build: { context: ., dockerfile: deploy/Ai.Dockerfile }
    environment:
      no_proxy: "minio,api,ai,db,localhost,127.0.0.1"
      NO_PROXY: "minio,api,ai,db,localhost,127.0.0.1"
      ASPNETCORE_HTTP_PORTS: "8080"
      Internal__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      Storage__Bucket: contractai
      Foundry__OpenAiEndpoint: ${FOUNDRY_OPENAI_ENDPOINT:-}
      Foundry__ApiKey: ${FOUNDRY_API_KEY:-}
      Foundry__ChatDeployment: ${CHAT_DEPLOYMENT:-contractai-chat}
      ContentUnderstanding__Endpoint: ${CU_ENDPOINT:-}
      ContentUnderstanding__ApiKey: ${CU_API_KEY:-}
      ContentUnderstanding__Analyzer: ${CU_ANALYZER:-prebuilt-documentSearch}
      Rag__Provider: ${RAG_PROVIDER:-NoRag}
    depends_on:
      minio: { condition: service_healthy }
    restart: unless-stopped
  migrate:
    image: contractai-api:local
    build: { context: ., dockerfile: deploy/Api.Dockerfile }
    environment: *api-env
    command: ["--migrate"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  api:
    image: contractai-api:local
    build: { context: ., dockerfile: deploy/Api.Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
      ai: { condition: service_started }
    restart: unless-stopped
  web:
    image: contractai-web:local
    build: { context: ., dockerfile: deploy/Web.Dockerfile }
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  objectdata:
