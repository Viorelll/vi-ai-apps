server {
 listen 8080;
 resolver 127.0.0.11 valid=10s ipv6=off;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 51m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ {set $api_host api;proxy_pass http://$api_host:8080;proxy_http_version 1.1;proxy_request_buffering off;proxy_buffering off;proxy_read_timeout 90s;proxy_set_header X-Request-ID $request_id;}
 location / {try_files $uri $uri/ /index.html;}
}
