name: voiceai
x-local-net: &local-net
  NO_PROXY: "api,ai,db,minio,localhost,127.0.0.1"
  no_proxy: "api,ai,db,minio,localhost,127.0.0.1"
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: voiceai
      POSTGRES_USER: voiceai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env and set DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceai -d voiceai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: voiceai-minio:local
    build: { context: ., dockerfile: deploy/Minio.Dockerfile }
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["objectdata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  ai:
    build: { context: ., dockerfile: deploy/Ai.Dockerfile }
    environment:
      <<: *local-net
      ASPNETCORE_HTTP_PORTS: "8080"
      Internal__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      Foundry__Endpoint: ${FOUNDRY_ENDPOINT:-}
      Foundry__ApiKey: ${FOUNDRY_API_KEY:-}
      Foundry__Deployment: ${FOUNDRY_DEPLOYMENT:-voiceai-chat}
      Speech__Endpoint: ${SPEECH_ENDPOINT:-}
      Speech__Region: ${SPEECH_REGION:-eastus}
      Speech__ApiKey: ${SPEECH_API_KEY:-}
    restart: unless-stopped
  migrate:
    build: { context: ., dockerfile: deploy/Api.Dockerfile }
    command: ["--migrate"]
    environment:
      <<: *local-net
      ASPNETCORE_HTTP_PORTS: "8080"
      Internal__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      ConnectionStrings__App: Host=db;Database=voiceai;Username=voiceai;Password=${DB_PASSWORD:?set DB_PASSWORD}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      Storage__Bucket: voiceai
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"
  api:
    build: { context: ., dockerfile: deploy/Api.Dockerfile }
    environment:
      <<: *local-net
      ASPNETCORE_HTTP_PORTS: "8080"
      Internal__Key: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      ConnectionStrings__App: Host=db;Database=voiceai;Username=voiceai;Password=${DB_PASSWORD:?set DB_PASSWORD}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      Storage__Bucket: voiceai
      Ai__BaseUrl: http://ai:8080/
    depends_on:
      migrate: { condition: service_completed_successfully }
      ai: { condition: service_started }
      minio: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: { context: ., dockerfile: deploy/Web.Dockerfile }
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  pgdata:
  objectdata:
