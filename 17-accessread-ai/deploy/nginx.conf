server {
listen 80;
server_name _;
root /usr/share/nginx/html;
client_max_body_size 55m;
add_header X-Content-Type-Options nosniff;
add_header Referrer-Policy no-referrer;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'";
resolver 127.0.0.11 valid=10s;
set $api_upstream http://api:8080;
location /api/ { proxy_pass $api_upstream; proxy_read_timeout 180s; proxy_set_header Host $host; }
location / { try_files $uri /index.html; }
}
