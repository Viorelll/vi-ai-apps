resolver 127.0.0.11 valid=5s ipv6=off;
upstream voiceai_api { zone voiceai_api 64k; server api:8080 resolve; }
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; img-src 'self' data:; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://voiceai_api; proxy_read_timeout 75s; proxy_set_header Host $host; }
  location /health/ { proxy_pass http://voiceai_api; }
  location / { try_files $uri /index.html; }
}
