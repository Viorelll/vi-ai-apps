server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 51m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location /api/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; }
 location /health/ { proxy_pass http://api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
