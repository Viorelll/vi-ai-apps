server {
 listen 80; server_name _; root /usr/share/nginx/html;
 client_max_body_size 55m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location /health { access_log off; return 200 "ok"; }
 location /api/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_read_timeout 120s; proxy_buffering off; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { try_files $uri $uri/ /index.html; }
}
