# Cloud runner proxy and its public CA bundle; TLS certificate verification stays enabled.
x-cloud-build: &cloud-build
  network: host
  extra_hosts:
    - "${EVALAI_PROXY_HOST:-proxy}:${EVALAI_PROXY_IP:?Set EVALAI_PROXY_IP from host proxy DNS}"
  args:
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
  secrets: [egress_ca]
x-cloud-env: &cloud-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: localhost,127.0.0.1,db,minio,api,ai
services:
  api:
    build: *cloud-build
  ai:
    build: *cloud-build
    environment: *cloud-env
    extra_hosts:
      - "${EVALAI_PROXY_HOST:-proxy}:${EVALAI_PROXY_IP:?Set EVALAI_PROXY_IP}"
  migrate:
    build: *cloud-build
  web:
    build: *cloud-build
secrets:
  egress_ca:
    file: /etc/ssl/certs/ca-certificates.crt
